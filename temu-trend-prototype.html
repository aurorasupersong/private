function CATEGORYMIXHTML(){return '<div class="mix categorymix">'+CATEGORIES.map(function(x){return '<div><label>'+x+'</label><input type="number" min="0" max="100" data-category-mix="'+x+'" value="'+S.categoryMix[x]+'"><span>%</span></div>'}).join("")+'</div><div class="total" id="categoryTotal"><span>品类比例 · 合计需为 100%</span><strong>'+CATEGORIES.reduce(function(a,x){return a+Number(S.categoryMix[x])},0)+'%</strong></div>'}

function EVIDENCE(){let a=D.filter(function(p){return p.phase===S.stage});if(a.length<2)a=a.concat(D.filter(function(p){return p.phase!==S.stage}).slice(0,2));return a.slice(0,3).map(function(p){return '<div class="evidence"><img src="'+p.img+'" alt=""><div><b>'+E(p.title)+'</b><small>'+p.id+' · '+p.phase+' · '+p.evidence+' 项证据</small></div><strong>'+p.confidence+'%</strong></div>'}).join("")}
function INSIGHT(){let c={"萌芽期":1,"成长期":2,"成熟期":1,"衰退期":1};return '<div class="page"><div class="head"><div><div class="eyebrow">TREND INSIGHT · COMPETITOR POOL</div><h1>趋势洞察</h1><p>先判断商品生命周期，再将灵感图、标签与经营证据整理为企划输入。</p></div><div class="actions"><button class="btn" data-view="planning">进入企划任务 →</button><button class="btn primary" data-view="planning">＋ 新建企划任务</button></div></div><div class="grid stats"><div class="card stat"><small>商品样本 · 演示</small><b>1,474,407</b><span>跨站点商品池示例值</span></div><div class="card stat"><small>本期增长样本</small><b>2,816</b><span>按选定周期规则筛选</span></div><div class="card stat"><small>待人工复核</small><b>126</b><span>缺字段或置信度偏低</span></div><div class="card stat"><small>规则版本</small><b>'+S.rule+'</b><span>保存阶段结果与判断证据</span></div></div>'+FLOW(0)+'<div class="grid phases">'+ST.map(function(x){return '<div class="card phasecard '+(S.filter===x?"sel":"")+'" data-phase="'+x+'"><strong>'+P({phase:x})+'</strong><small>'+c[x]+' 条示例 · '+(x==="成长期"?"拆解爆款元素":x==="成熟期"?"沉淀常青版型":x==="萌芽期"?"小样本验证":"评估调整")+'</small></div>'}).join("")+'</div><div class="card"><div class="toolbar"><div class="toolrow"><label class="search">⌕ <input id="query" placeholder="搜索商品 ID、标题或店铺" value="'+E(S.query)+'"></label><select class="select" id="filter"><option value="">全部生命周期</option>'+ST.map(function(x){return '<option '+(S.filter===x?"selected":"")+'>'+x+'</option>'}).join("")+'</select><select class="select"><option>美国站</option></select><select class="select"><option>Temu</option><option>SHEIN</option></select></div><div class="toolrow"><button class="btn" id="export">⇩ 导出样本</button></div></div><div class="tablewrap"><table class="table"><thead><tr><th>商品信息</th><th>商品标题</th><th>趋势生命周期</th><th>阶段信号</th><th>标签证据</th><th>价格</th><th>置信度</th></tr></thead><tbody id="rows">'+ROWS()+'</tbody></table></div><div class="toolbar"><small id="rowCount">显示 '+LIST().length+' 条演示商品</small><small>低置信度 / 缺失字段商品进入人工复核</small></div></div><div class="note"><b>数据治理：</b>原始事实与阶段判断分开保存；每条判断保留来源、采集时间、规则版本、证据数和置信度。数据采集范围需遵守授权与平台规则。</div></div>'}
function PLANNING(){let has=function(a,x){return a.indexOf(x)>-1};return `<div class="page"><div class="head"><div><div class="eyebrow">PLANNING TASK · MULTI-REPORT</div><h1>企划任务</h1><p>组合多份生命周期企划报告，以常青版型承接爆款元素，并按店铺货盘比例约束生成任务。</p></div><div class="actions"><span class="tagtop demo">可组合多份报告</span><button class="btn primary" id="make">生成企划报告 →</button></div></div>${FLOW(1)}<section class="card panel"><div class="panelhead"><div><h2>任务范围</h2><p>先明确店铺、周期和任务目标。</p></div><span class="tag">任务配置</span></div><div class="fields"><div class="field"><label>任务名称</label><input data-task-name value="${E(S.taskName)}"></div><div class="field"><label>市场 / 站点</label><select><option>美国</option><option>英国</option><option>德国</option></select></div><div class="field"><label>平台</label><select><option>Temu</option><option>SHEIN</option><option>独立站</option></select></div><div class="field"><label>目标店铺</label><select><option>Y2 美国女装试点店</option><option>美国女装店 B</option></select></div><div class="field"><label>企划周期</label><select><option>未来 4–6 周</option><option>未来 8 周</option></select></div><div class="field"><label>目标人群</label><select><option>美国女性 · 25–44</option><option>按店铺画像选择</option></select></div></div></section><div class="split" style="margin-top:10px"><section class="card panel"><div class="panelhead"><div><h2>企划报告组合</h2><p>勾选一份或多份报告，合并为同一个企划任务。</p></div><span class="tag">已选 ${S.selectedStages.length} 份</span></div><div class="choice-list">${ST.map(function(x){return `<label class="checkcard"><input type="checkbox" data-reportstage="${x}" ${has(S.selectedStages,x)?"checked":""}><span><b>${TXT[x][0]}</b><small>${x} · ${TXT[x][1]}</small></span><em>${x==="成熟期"?"版型沉淀":x==="成长期"?"爆点拆解":x==="萌芽期"?"信号验证":"调整建议"}</em></label>`}).join("")}</div><div class="note">企划任务会汇总所选报告的阶段结论、证据商品和风险提示；阶段与报告内容均为演示样例。</div></section><section class="card panel"><div class="panelhead"><div><h2>常青版型 × 爆款元素</h2><p>版型作为稳定底盘，爆款元素按阶段证据小批验证。</p></div><button class="btn" data-view="evergreenConfig">配置候选条件</button></div><div class="choice-list compact">${EVERGREEN.map(function(x,i){return `<label class="checkcard"><input type="checkbox" data-evergreen="${x}" ${has(S.evergreen,x)?"checked":""}><span><b>${x}</b><small>${i===0?"稳定轮廓 · 通过演示门槛":"可复用结构 · 通过演示门槛"}</small></span><em class="good">候选</em></label>`}).join("")}</div><div class="element-title">阶段爆点元素 <small>至少选择一项</small></div><div class="element-list">${HOT.map(function(x){return `<label class="element"><input type="checkbox" data-hot-element="${x}" ${has(S.hotElements,x)?"checked":""}>${x}</label>`}).join("")}</div></section></div><div class="split" style="margin-top:10px"><section class="card panel"><div class="panelhead"><div><h2>商品角色比例</h2><p>按店铺货盘结构设置引流、核心、利润和试错款占比。</p></div><span class="tag warn">合计必须 100%</span></div>${MIXHTML()}</section><section class="card panel"><div class="panelhead"><div><h2>品类比例约束</h2><p>多个品类共同组成店铺货盘，支持按本轮企划调整。</p></div><span class="tag warn">合计必须 100%</span></div>${CATEGORYMIXHTML()}</section></div><div class="note warn" style="margin-top:10px"><b>生成校验：</b>至少选一份报告、一种通过条件的常青版型和一个爆款元素；商品角色比例与品类比例分别合计 100%。</div></div>`}
function REPORT(){let roles=MIX.reduce(function(a,x){return a+Number(S.mix[x])},0),cats=CATEGORIES.reduce(function(a,x){return a+Number(S.categoryMix[x])},0);return `<div class="page"><div class="head"><div><div class="eyebrow">PLANNING REPORT · MULTI-REPORT SUMMARY</div><h1>企划报告（多报告汇总）</h1><p>${E(S.taskName)} · ${S.selectedStages.join("、")} · ${S.rule}</p></div><div class="actions"><button class="btn" data-view="planning">← 返回任务</button><button class="btn primary" id="confirm">${S.confirmed?"已确认 · 打开 Design Brief":"确认企划方向并生成 Brief →"}</button></div></div>${FLOW(2)}<div class="card report"><h2>${E(S.taskName)}</h2><p>美国站 · Temu · 企划周期：未来 4–6 周　·　已合并 ${S.selectedStages.length} 份报告　·　演示草案</p><div class="sect"><h3>01 · 纳入的阶段企划报告</h3><div class="report-list">${S.selectedStages.map(function(x){return `<div class="report-item"><span>${P({phase:x})}</span><div><b>${TXT[x][0]}</b><small>${TXT[x][1]}</small></div><strong>已纳入</strong></div>`}).join("")}</div></div><div class="sect twocol"><div class="feature"><b>常青版型 · 稳定底盘</b><p>${S.evergreen.join("、")}。按配置条件筛选候选，正式采用前由企划与设计师复核。</p></div><div class="feature"><b>阶段爆点 · 变化方向</b><p>${S.hotElements.join("、")}。结合所选阶段报告和商品证据确认适用范围。</p></div></div><div class="sect twocol"><div><h3>02 · 商品角色货盘比 <span class="tag warn">合计 ${roles}%</span></h3><div class="mixview">${MIX.map(function(x){return `<div><b>${S.mix[x]}%</b><small>${x}</small></div>`}).join("")}</div></div><div><h3>03 · 品类货盘比 <span class="tag warn">合计 ${cats}%</span></h3><div class="mixview">${CATEGORIES.map(function(x){return `<div><b>${S.categoryMix[x]}%</b><small>${x}</small></div>`}).join("")}</div></div></div><div class="sect"><h3>04 · 商品与标签证据</h3>${EVIDENCE()}</div><div class="sect twocol"><div class="feature"><b>风险控制</b><p>低置信度、缺失字段和异常时间样本转人工复核；记录数据来源、采集时间和规则版本。</p></div><div class="feature"><b>输出流转</b><p>企划负责人确认 → 生成 Design Brief → 智能设计任务 → 经营数据回流至数据概览。</p></div></div><div class="note">报告合并与比例校验为前端原型逻辑；数据与候选条件均为演示配置。</div></div></div>`}
function BRIEF(){return `<div class="page"><div class="head"><div><div class="eyebrow">DESIGN BRIEF · PLAN TO DESIGN</div><h1>Design Brief</h1><p>将已确认的多报告企划任务转成设计师可执行、可评审的结构化任务。</p></div><div class="actions"><button class="btn" data-view="report">← 返回企划报告</button><button class="btn primary" data-view="design">进入智能设计 →</button></div></div>${FLOW(3)}<div class="briefgrid"><section class="card panel"><div class="panelhead"><div><h2>设计任务内容</h2><p>企划和设计师共同补充确认。</p></div><span class="tag">${S.confirmed?"企划已确认":"演示草案 · 待确认"}</span></div><div class="briefgroup"><b>人群与场景</b><div class="briefcards"><div class="bcard"><small>企划任务</small><input value="${E(S.taskName)}"></div><div class="bcard"><small>市场 / 客群</small><input value="美国女性消费者，25–44 岁；按店铺数据复核"></div><div class="bcard"><small>穿着场景</small><input value="日常通勤、周末出行、夏日度假"></div><div class="bcard"><small>生命周期报告</small><input value="${E(S.selectedStages.join("、"))}"></div></div></div><div class="briefgroup"><b>款式与元素</b><div class="briefcards"><div class="bcard"><small>常青版型</small><textarea>${E(S.evergreen.join("、"))}；按舒适度、尺码容错与复用条件复核</textarea></div><div class="bcard"><small>阶段爆点</small><textarea>${E(S.hotElements.join("、"))}；小批次验证</textarea></div><div class="bcard"><small>颜色 / 面料方向</small><textarea>清爽蓝白、柔和中性色；结合店铺历史表现复核</textarea></div><div class="bcard"><small>品类货盘比</small><textarea>${CATEGORIES.map(function(x){return x+" "+S.categoryMix[x]+"%"}).join("；")}</textarea></div></div></div><div class="briefgroup"><b>商品约束</b><div class="briefcards"><div class="bcard"><small>角色货盘比</small><input value="${MIX.map(function(x){return x+" "+S.mix[x]+"%"}).join("；")}"></div><div class="bcard"><small>成本边界</small><input value="接入核价与供应链成本后确认"></div><div class="bcard"><small>设计数量</small><input value="先生成 3 个方向供评审"></div><div class="bcard"><small>审核节点</small><input value="企划、设计师、供应链复核"></div></div></div><div class="note">来源追溯：所选企划报告、商品证据和规则 ${S.rule}。未确认字段为假设，不作生产指令。</div></section><aside class="card panel"><div class="panelhead"><div><h2>关联参考商品</h2><p>来自当前竞品商品池示例。</p></div></div><div class="ref"><img src="assets/product-5.png" alt=""><div><b>Summer Floral Beach Cover Up Dress</b><small>${E(S.selectedStages.join("、"))} · 花卉 / 雪纺 / 中长款</small></div></div><div class="feature" style="margin-top:8px"><b>企划类型</b><p>${S.selectedStages.map(function(x){return TXT[x][0]}).join("、")}</p></div><div class="feature" style="margin-top:6px"><b>系统边界</b><p>智能设计读取确认企划和知识库；关键决策由业务与设计师确认。</p></div><button class="btn primary" data-view="design" style="width:100%;margin-top:10px">创建智能设计任务</button></aside></div></div>`}
function DESIGN(){let cards=S.generated?'<div class="previews">'+[["A · 常青底盘","A-line · 植物小花 · 系带","assets/product-5.png"],["B · 阶段变化","衬衫裙 · 边饰构图 · 蓝白","assets/product-2.png"],["C · 试错款","裹身裙 · 放大花型 · 低比例验证","assets/product-4.png"]].map(function(a){return '<div class="preview"><img src="'+a[2]+'" alt="参考图示意"><div><b>方向 '+a[0]+'</b><p>'+a[1]+' · 现有商品参考图</p></div></div>'}).join("")+'</div>':'<div class="empty">等待生成设计方向<br><button class="btn primary" id="sim" style="margin-top:10px">模拟生成 3 个方向</button></div>';return '<div class="page"><div class="head"><div><div class="eyebrow">SMART DESIGN · HUMAN REVIEW</div><h1>智能设计</h1><p>读取确认企划和设计知识库，生成可供人工评审的设计方向。</p></div><div class="actions"><button class="btn" data-view="brief">← 查看 Brief</button><button class="btn primary" id="simTop">'+(S.generated?"重新生成方向":"生成设计方向")+'</button></div></div>'+FLOW(4)+'<div class="toolrow" style="margin-bottom:9px"><span class="tag">前端演示 · 不调用图像模型</span><span class="tag">3 个方向 / 人工评审</span></div><div class="designgrid"><aside class="card panel"><div class="panelhead"><div><h2>任务上下文</h2><p>由企划和 Brief 继承。</p></div></div><div class="feature"><b>品类 / 市场</b><p>美国站 · Temu · 连衣裙</p></div><div class="feature" style="margin-top:6px"><b>版型 / 元素</b><p>A-line、衬衫裙；植物花型、边饰、系带</p></div><div class="feature" style="margin-top:6px"><b>生产约束</b><p>成本、面料与工艺需接入知识库校验。</p></div><div class="note warn">参考图为现有样本；设计师需审核审美与可生产性。</div><button class="btn" data-view="overview" style="width:100%;margin-top:9px">查看数据概览 →</button></aside><section class="card panel"><div class="panelhead"><div><h2>设计方向预览</h2><p>展示企划方向的转译位置，图片不是模型生成结果。</p></div><small>'+(S.generated?"待设计师评审":"尚未生成")+'</small></div>'+cards+'</section></div></div>'}
function OVERVIEW(){return `<div class="page"><div class="head"><div><div class="eyebrow">DATA OVERVIEW · PLANNING LOOP</div><h1>数据概览</h1><p>汇总趋势样本、企划任务、设计流转和经营结果，支持阶段复盘。</p></div><div class="actions"><button class="btn" data-view="insight">查看趋势洞察</button><button class="btn primary" data-view="planning">＋ 新建企划任务</button></div></div><div class="grid stats"><div class="card stat"><small>趋势商品样本 · 演示</small><b>1,474,407</b><span>当前筛选口径下的样本量</span></div><div class="card stat"><small>待复核信号</small><b>126</b><span>缺字段或置信度偏低</span></div><div class="card stat"><small>企划任务</small><b>24</b><span>本周期已创建 · 示例值</span></div><div class="card stat"><small>设计任务转化</small><b>68%</b><span>企划确认后进入设计 · 示例值</span></div></div>${FLOW(5)}<div class="split"><section class="card panel"><div class="panelhead"><div><h2>生命周期样本分布</h2><p>点击阶段可回到趋势洞察筛选商品。</p></div><button class="btn" data-view="lifecycleConfig">查看口径配置</button></div><div class="bar-chart">${[{n:"萌芽期",v:18,w:34},{n:"成长期",v:36,w:68},{n:"成熟期",v:29,w:55},{n:"衰退期",v:17,w:32}].map(function(x){return `<div class="chart-row"><button data-phase="${x.n}">${x.n}</button><div class="bar-track"><i style="width:${x.w}%"></i></div><b>${x.v}%</b></div>`}).join("")}</div><div class="note">阶段比例为原型数据；进入商品池后可查看商品标题、趋势生命周期、信号与证据。</div></section><section class="card panel"><div class="panelhead"><div><h2>企划到经营回流</h2><p>逐步打通任务、设计、上架和售后指标。</p></div><span class="tagtop demo">数据待接入</span></div><div class="loop"><div><b>企划采纳</b><small>企划方向进入开款的比例</small></div><div><b>上架转化</b><small>设计任务到商品上架的比例</small></div><div><b>经营表现</b><small>GMV、售罄速度与广告 ROI</small></div><div><b>售后反馈</b><small>退货率、差评与客诉</small></div></div><div class="feature"><b>当前状态</b><p>原型指标占位；正式接入后按店铺、品类、企划任务和上架批次筛选。</p></div></section></div><div class="split" style="margin-top:10px"><section class="card panel"><div class="panelhead"><div><h2>企划任务进度</h2><p>按阶段跟进报告确认与设计任务创建。</p></div><button class="btn" data-view="planning">打开企划任务</button></div><div class="tablewrap"><table class="table"><thead><tr><th>任务</th><th>所选报告</th><th>状态</th><th>负责人</th></tr></thead><tbody><tr><td>美国站连衣裙企划</td><td>成长期 / 成熟期</td><td><span class="tag">待确认</span></td><td>企划组</td></tr><tr><td>夏季轻薄上衣企划</td><td>成长期</td><td><span class="tag">设计中</span></td><td>设计组</td></tr><tr><td>常青版型补充企划</td><td>成熟期</td><td><span class="tag">待复盘</span></td><td>企划组</td></tr></tbody></table></div></section><section class="card panel"><div class="panelhead"><div><h2>数据质量与规则版本</h2><p>判断可追溯，配置独立维护。</p></div></div><div class="feature"><b>规则版本 · ${S.rule}</b><p>原始事实、阶段判断、置信度和人工复核状态分开保存。</p></div><div class="feature" style="margin-top:7px"><b>常青版型候选</b><p>按覆盖期、速度分位、卖家数量与头部集中度筛选。</p></div><div class="actions" style="margin-top:9px"><button class="btn" data-view="lifecycleConfig">生命周期口径</button><button class="btn" data-view="evergreenConfig">常青版型条件</button></div></section></div></div>`}
function LIFECYCLE_CONFIG(){return `<div class="page"><div class="head"><div><div class="eyebrow">BACKEND CONFIG · LIFECYCLE</div><h1>生命周期口径配置</h1><p>配置首发候选与趋势簇生命周期的判断窗口、阶段信号和复核规则。</p></div><div class="actions"><span class="tagtop demo">当前版本 ${S.rule}</span><button class="btn primary" id="saveLifecycle">保存演示配置</button></div></div><div class="note warn">商品级首发候选与趋势簇生命周期分开判断；修改规则后保留版本和历史判断，不覆盖原始数据。</div><div class="split" style="margin-top:10px"><section class="card panel"><div class="panelhead"><div><h2>商品级首发候选</h2><p>识别新上架且数据可用的商品样本。</p></div><span class="tag">候选判断</span></div><div class="fields"><div class="field"><label>上架观察天数上限</label><input type="number" value="14"></div><div class="field"><label>最低有效数据天数</label><input type="number" value="7"></div><div class="field"><label>最低有效样本量</label><input type="number" value="10"></div></div><div class="note">字段不足、上架时间异常或采集来源不明的商品转人工复核。</div></section><section class="card panel"><div class="panelhead"><div><h2>公共判断与复核规则</h2><p>所有阶段共用的质量门槛。</p></div></div><div class="fields"><div class="field"><label>置信度复核阈值 %</label><input type="number" value="70"></div><div class="field"><label>成熟观察窗口（周）</label><input type="number" value="4"></div><div class="field"><label>生命周期窗口（天）</label><input type="number" value="90"></div></div><div class="feature"><b>数据策略</b><p>授权数据优先；保留来源、统计周期、采集时间和规则版本。</p></div></section></div><section class="card panel" style="margin-top:10px"><div class="panelhead"><div><h2>趋势簇阶段口径</h2><p>阶段由增长、稳定性和样本置信度共同判断。</p></div><span class="tag warn">阈值为演示值</span></div><div class="tablewrap"><table class="table"><thead><tr><th>阶段</th><th>参考判断信号</th><th>参考阈值</th><th>处理动作</th></tr></thead><tbody><tr><td>萌芽期</td><td>搜索 / 点击出现新信号，样本较少</td><td>至少 2 个独立来源</td><td>小比例验证，保留人工复核</td></tr><tr><td>成长期</td><td>销量增速与趋势增速同步上升</td><td>参考增速 ≥ 20%</td><td>拆解版型与爆点元素</td></tr><tr><td>成熟期</td><td>销量稳定、跨周持续且样本足够</td><td>连续观察 4 周</td><td>评估沉淀常青版型</td></tr><tr><td>衰退期</td><td>增速持续回落并排除季节扰动</td><td>参考增速 ≤ -15%</td><td>调整、替换或退出</td></tr></tbody></table></div><div class="note">生命周期阶段归属趋势簇；商品本身可标记为首发候选，两者不互相替代。</div></section></div>`}
function EVERGREEN_CONFIG(){return `<div class="page"><div class="head"><div><div class="eyebrow">BACKEND CONFIG · EVERGREEN SILHOUETTE</div><h1>常青版型条件配置</h1><p>用跨周期稳定性和分散度筛选可复用版型，爆款元素仍按阶段单独评估。</p></div><div class="actions"><span class="tagtop demo">条件版本 v0.2-demo</span><button class="btn primary" id="saveEvergreen">保存演示配置</button></div></div><div class="note warn"><b>版型与元素分开评估：</b>常青候选来自稳定版型证据；花型、颜色和装饰元素作为独立的阶段变化项，不因版型入选而自动认定为爆款。</div><div class="split" style="margin-top:10px"><section class="card panel"><div class="panelhead"><div><h2>候选观察窗口</h2><p>候选需跨时间和多个商品持续出现。</p></div></div><div class="fields"><div class="field"><label>回看周期（天）</label><input type="number" value="180"></div><div class="field"><label>连续周快照</label><input type="number" value="12"></div><div class="field"><label>有效商品批次</label><input type="number" value="3"></div><div class="field"><label>最低独立卖家数</label><input type="number" value="5"></div><div class="field"><label>销售速度分位下限</label><input type="number" value="50"></div><div class="field"><label>头部集中度上限 %</label><input type="number" value="60"></div></div><div class="feature"><b>入池逻辑</b><p>满足观察覆盖、持续快照、销售稳定和多卖家验证后进入常青候选；高头部集中度触发暂缓入池。</p></div></section><section class="card panel"><div class="panelhead"><div><h2>候选审核与排除</h2><p>条件筛选后由企划和设计师确认。</p></div></div><div class="rule-list"><div class="rule-card"><strong>候选版型</strong><span>A-line 连衣裙、衬衫裙、裹身裙等，按品类单独维护。</span></div><div class="rule-card"><strong>暂缓条件</strong><span>单一头部卖家贡献过高、样本连续性不足、尺码或售后风险异常。</span></div><div class="rule-card"><strong>确认记录</strong><span>保留候选版型、证据商品、适用市场、规则版本和人工审核结果。</span></div></div><div class="note">当前页面为配置原型；阈值需由企划、数据、运营共同校准。</div></section></div><section class="card panel" style="margin-top:10px"><div class="panelhead"><div><h2>常青候选清单 · 示例</h2><p>阶段验证通过不代表已纳入正式知识库。</p></div></div><div class="tablewrap"><table class="table"><thead><tr><th>版型</th><th>观察覆盖</th><th>独立卖家</th><th>头部集中度</th><th>候选状态</th></tr></thead><tbody><tr><td>A-line 连衣裙</td><td>180 天</td><td>18</td><td>42%</td><td><span class="tag">通过初筛</span></td></tr><tr><td>衬衫裙</td><td>180 天</td><td>12</td><td>51%</td><td><span class="tag">通过初筛</span></td></tr><tr><td>裹身裙</td><td>120 天</td><td>4</td><td>67%</td><td><span class="tag warn">待补样本</span></td></tr></tbody></table></div></section></div>`}
function render(){document.getElementById("crumb").textContent=LABEL[S.view];let navView=({report:"planning",brief:"design"})[S.view]||S.view;document.querySelectorAll(".nav [data-view]").forEach(function(x){x.classList.toggle("active",x.dataset.view===navView)});ROOT.innerHTML=({insight:INSIGHT,planning:PLANNING,report:REPORT,brief:BRIEF,design:DESIGN,overview:OVERVIEW,lifecycleConfig:LIFECYCLE_CONFIG,evergreenConfig:EVERGREEN_CONFIG})[S.view]();bind()}
function go(v){if(LABEL[v]){S.view=v;render();ROOT.scrollTop=0}}
function toast(x){let t=document.getElementById("toast");t.textContent=x;t.classList.add("show");clearTimeout(window.__t);window.__t=setTimeout(function(){t.classList.remove("show")},2000)}
function bind(){let q=document.getElementById("query");if(q)q.addEventListener("input",function(){S.query=this.value;document.getElementById("rows").innerHTML=ROWS();document.getElementById("rowCount").textContent="显示 "+LIST().length+" 条演示商品"});let f=document.getElementById("filter");if(f)f.addEventListener("change",function(){S.filter=this.value;document.getElementById("rows").innerHTML=ROWS();document.getElementById("rowCount").textContent="显示 "+LIST().length+" 条演示商品"});let name=document.querySelector("[data-task-name]");if(name)name.addEventListener("input",function(){S.taskName=this.value});let make=document.getElementById("make");if(make)make.onclick=function(){let roles=MIX.reduce(function(a,x){return a+Number(S.mix[x])},0),cats=CATEGORIES.reduce(function(a,x){return a+Number(S.categoryMix[x])},0);if(!S.selectedStages.length){toast("请至少选择一份企划报告");return}if(!S.evergreen.length){toast("请至少选择一个常青版型候选");return}if(!S.hotElements.length){toast("请至少选择一个阶段爆款元素");return}if(roles!==100||cats!==100){toast("商品角色比例和品类比例都必须合计 100%");return}S.stage=S.selectedStages[0];S.confirmed=false;go("report")};let cb=document.getElementById("confirm");if(cb)cb.onclick=function(){S.confirmed=true;go("brief");toast("企划方向已确认并带入 Design Brief")};["sim","simTop"].forEach(function(id){let b=document.getElementById(id);if(b)b.onclick=function(){S.generated=true;render();toast("演示方向已生成，待设计师评审")}});let ex=document.getElementById("export");if(ex)ex.onclick=function(){let a=[["商品ID","标题","趋势生命周期","阶段信号","置信度","来源","采集时间"]].concat(LIST().map(function(p){return[p.id,p.title,p.phase,p.signal,p.confidence+"%",p.source,p.time]}));let csv="\ufeff"+a.map(function(r){return r.map(function(v){return '"'+String(v).replace(/"/g,'""')+'"'}).join(",")}).join("\n");let l=document.createElement("a");l.href=URL.createObjectURL(new Blob([csv],{type:"text/csv;charset=utf-8"}));l.download="趋势洞察商品样本.csv";l.click();URL.revokeObjectURL(l.href)}}
function detail(id){let p=D.find(function(x){return x.id===id});if(!p)return;document.getElementById("modalRoot").innerHTML='<div class="modalbg show"><div class="modal"><div class="modalhead"><b>商品证据 · '+p.id+'</b><button class="btn" data-close>关闭</button></div><div class="modalbody"><div class="detail"><img src="'+p.img+'" alt=""><div><h2 style="font-size:12px">'+E(p.title)+'</h2>'+P(p)+' <span class="tag">'+p.confidence+'% 置信度</span><dl><dt>品类</dt><dd>'+E(p.category)+'</dd><dt>店铺</dt><dd>'+E(p.shop)+'</dd><dt>阶段信号</dt><dd>'+p.signal+' · '+p.hint+'</dd><dt>证据数</dt><dd>'+p.evidence+' 项</dd><dt>标签</dt><dd>'+p.tags.join("、")+'</dd><dt>来源 / 时间</dt><dd>'+p.source+' · '+p.time+'</dd><dt>规则版本</dt><dd>'+S.rule+' · 演示配置</dd></dl><div class="note '+(p.confidence<70?"warn":"")+'">'+(p.confidence<70?"置信度偏低，需人工复核。":"判定依据可追溯。")+'</div></div></div></div><div class="modalfoot"><button class="btn primary" data-add>加入企划证据</button></div></div></div>'}
document.addEventListener("click",function(e){let v=e.target.closest("[data-view]");if(v){go(v.dataset.view);return}let ph=e.target.closest("[data-phase]");if(ph){S.filter=S.filter===ph.dataset.phase?"":ph.dataset.phase;go("insight");return}let r=e.target.closest("tr[data-id]");if(r){detail(r.dataset.id);return}if(e.target.closest("[data-close]")||e.target.classList.contains("modalbg")){document.getElementById("modalRoot").innerHTML="";return}if(e.target.closest("[data-add]")){document.getElementById("modalRoot").innerHTML="";toast("已加入企划证据");return}if(e.target.id==="saveLifecycle"){S.rule="v0.4-draft";render();toast("生命周期口径已保存为演示版本");return}if(e.target.id==="saveEvergreen"){render();toast("常青版型条件已保存为演示配置");return}});
document.addEventListener("change",function(e){let t=e.target;if(t.matches("[data-reportstage]")){let x=t.dataset.reportstage;S.selectedStages=t.checked?Array.from(new Set(S.selectedStages.concat(x))):S.selectedStages.filter(function(a){return a!==x});if(S.selectedStages.length)S.stage=S.selectedStages[0];render();return}if(t.matches("[data-evergreen]")){let x=t.dataset.evergreen;S.evergreen=t.checked?Array.from(new Set(S.evergreen.concat(x))):S.evergreen.filter(function(a){return a!==x});render();return}if(t.matches("[data-hot-element]")){let x=t.dataset.hotElement;S.hotElements=t.checked?Array.from(new Set(S.hotElements.concat(x))):S.hotElements.filter(function(a){return a!==x});render()}});
document.addEventListener("input",function(e){let t=e.target;if(t.matches("[data-mix]")){S.mix[t.dataset.mix]=Math.max(0,Math.min(100,Number(t.value)||0));let n=MIX.reduce(function(a,x){return a+Number(S.mix[x])},0),el=document.getElementById("total");if(el){el.className="total "+(n===100?"ok":"bad");el.innerHTML="<span>商品角色比例 · 合计需为 100%</span><strong>"+n+"%</strong>"}}if(t.matches("[data-category-mix]")){S.categoryMix[t.dataset.categoryMix]=Math.max(0,Math.min(100,Number(t.value)||0));let n=CATEGORIES.reduce(function(a,x){return a+Number(S.categoryMix[x])},0),el=document.getElementById("categoryTotal");if(el){el.className="total "+(n===100?"ok":"bad");el.innerHTML="<span>品类比例 · 合计需为 100%</span><strong>"+n+"%</strong>"}}});
render();
</script></body></html>
