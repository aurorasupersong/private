采集范围需遵守授权与平台规则。</div></div>'}
function PLANNING(){return '<div class="page"><div class="head"><div><div class="eyebrow">SMART PLANNING · TASK BUILDER</div><h1>智能企划工作台</h1><p>常青版型 × 阶段爆点 + 货盘比，形成可执行企划。</p></div><div class="actions"><span class="tagtop demo">4–6 周试点 · 连衣裙</span><button class="btn primary" id="make">生成企划报告 →</button></div></div>'+FLOW(1)+'<div class="split"><section class="card panel"><div class="panelhead"><div><h2>企划任务范围</h2><p>从单市场、单平台、单品类验证闭环。</p></div><span class="tag">试点建议</span></div><div class="fields"><div class="field"><label>市场</label><select><option>美国</option></select></div><div class="field"><label>平台</label><select><option>Temu</option></select></div><div class="field"><label>重点品类</label><select><option>连衣裙</option><option>沙滩女装</option></select></div><div class="field"><label>目标店铺</label><select><option>Y2 美国女装试点店</option></select></div><div class="field"><label>企划周期</label><select><option>未来 4–6 周</option></select></div><div class="field"><label>目标人群</label><select><option>美国女性 · 25–44</option></select></div></div><div class="panelhead"><div><h2>生命周期与报告类型</h2><p>当前主攻成长期、成熟期。</p></div></div><div class="tabs">'+ST.map(function(x){return '<button class="'+(S.stage===x?"active":"")+'" data-stage="'+x+'">'+x+'</button>'}).join("")+'</div><div class="typebox"><small>建议报告类型</small><b>'+TXT[S.stage][0]+'</b><p>'+TXT[S.stage][1]+'</p></div><div class="note warn"><b>规则提示：</b>生命周期阈值与标签权重是演示配置，上线前由企划、数据和运营校准。</div></section><section class="card panel"><div class="panelhead"><div><h2>货盘结构约束</h2><p>角色比例合计 100%，可按店铺策略调整。</p></div><span class="tag warn">示例比例</span></div>'+MIXHTML()+'<div class="feature" style="margin-top:8px"><b>常青版型 × 阶段爆点</b><p>从稳定商品沉淀版型、面料和场景；从增长商品提取可验证的花型、颜色与细节。</p></div><div class="feature" style="margin-top:6px"><b>人工确认保留</b><p>企划负责人确认后生成 Design Brief；生产、成本和供应链边界进入知识库。</p></div></section></div><div class="split" style="margin-top:10px"><section class="card panel"><div class="panelhead"><div><h2>本轮证据商品</h2><p>洞察回到商品图、标签、销量与来源。</p></div><button class="btn" data-view="insight">回商品池</button></div>'+EVIDENCE()+'</section><section class="card panel"><div class="panelhead"><div><h2>试点验证目标</h2><p>用于试点对比，不代表已经实现。</p></div></div><div class="feature"><b>企划初版周期缩短 30%–50%</b><p>比较资料整理和报告准备耗时。</p></div><div class="feature" style="margin-top:6px"><b>Brief 输出时间缩短 50%+</b><p>统计报告确认到 Brief 完成的时长。</p></div><div class="feature" style="margin-top:6px"><b>经营结果</b><p>跟踪采纳率、上架转化、售罄速度、退货和折扣。</p></div></section></div></div>'}
function REPORT(){let n=MIX.reduce(function(a,x){return a+Number(S.mix[x])},0);return '<div class="page"><div class="head"><div><div class="eyebrow">PLANNING REPORT · '+S.stage+'</div><h1>企划报告</h1><p>美国站 · Temu · 连衣裙 · '+TXT[S.stage][0]+'</p></div><div class="actions"><button class="btn" data-view="planning">← 返回工作台</button><button class="btn primary" id="confirm">'+(S.confirmed?"已确认 · 打开 Brief":"确认企划方向并生成 Brief →")+'</button></div></div>'+FLOW(2)+'<div class="card report"><h2>US Temu Dress · '+TXT[S.stage][0]+'</h2><p>企划周期：未来 4–6 周　·　规则 '+S.rule+'　·　'+(S.confirmed?"企划已确认":"待企划负责人确认")+'　·　演示草案</p><div class="sect"><h3>01 · 企划目标与结论</h3><p>以常青版型建立基础款供给，再用阶段元素做有限变化；按店铺货盘结构配置核心、利润与试错款。当前阶段为 '+S.stage+'，建议：'+TXT[S.stage][1]+'</p></div><div class="sect twocol"><div class="feature"><b>常青资产 · 稳定底盘</b><p>A-line 连衣裙、衬衫裙、裹身裙为版型候选；结合历史动销复核舒适度、尺码容错与易搭配性。</p></div><div class="feature"><b>阶段爆点 · 小样本验证</b><p>植物花型、边饰构图、系带腰部与轻薄梭织为候选。需以来源商品与评论证据验证。</p></div></div><div class="sect"><h3>02 · 店铺货盘结构 <span class="tag warn">演示比例 · 合计 '+n+'%</span></h3><div class="mixview">'+MIX.map(function(x){return '<div><b>'+S.mix[x]+'%</b><small>'+x+'</small></div>'}).join("")+'</div><p>正式执行前由店铺负责人确认。</p></div><div class="sect"><h3>03 · 商品与标签证据</h3>'+EVIDENCE()+'</div><div class="sect twocol"><div class="feature"><b>试点计划</b><p>4–6 周小流量验证；先筛样本，再对高价值商品做深度分析；设置预算、批次上限与失败告警。</p></div><div class="feature"><b>风险控制</b><p>销量缺失、上架时间异常或低置信度转人工复核；保留来源、时间和规则版本。</p></div></div><div class="note">内部演示数据，需业务复核。流转：企划确认 → Design Brief → 智能设计。</div></div></div>'}
function BRIEF(){return '<div class="page"><div class="head"><div><div class="eyebrow">DESIGN BRIEF · PLAN TO DESIGN</div><h1>Design Brief</h1><p>把已确认企划转成设计师可执行、可评审的结构化任务。</p></div><div class="actions"><button class="btn" data-view="report">← 返回报告</button><button class="btn primary" data-view="design">进入智能设计 →</button></div></div>'+FLOW(3)+'<div class="briefgrid"><section class="card panel"><div class="panelhead"><div><h2>设计任务内容</h2><p>企划与设计师共同补充确认。</p></div><span class="tag">'+(S.confirmed?"企划已确认":"演示草案 · 待确认")+'</span></div><div class="briefgroup"><b>人群与场景</b><div class="briefcards"><div class="bcard"><small>市场 / 客群</small><input value="美国女性消费者，25–44 岁；按店铺数据复核"></div><div class="bcard"><small>穿着场景</small><input value="日常通勤、周末出行、夏日度假"></div></div></div><div class="briefgroup"><b>款式与元素</b><div class="briefcards"><div class="bcard"><small>常青版型</small><textarea>A-line 连衣裙、衬衫裙；舒适穿着与尺码容错</textarea></div><div class="bcard"><small>阶段爆点</small><textarea>植物花型、边饰构图、系带腰部；小批次验证</textarea></div><div class="bcard"><small>颜色方向</small><textarea>清爽蓝白、柔和中性色；结合店铺历史色系复核</textarea></div><div class="bcard"><small>面料与工艺</small><textarea>轻薄梭织候选；检查透感、缩水与印花色差</textarea></div></div></div><div class="briefgroup"><b>商品约束</b><div class="briefcards"><div class="bcard"><small>货盘角色</small><input value="核心款优先，试错款按店铺比例控制"></div><div class="bcard"><small>成本边界</small><input value="接入核价与供应链成本后确认"></div><div class="bcard"><small>设计数量</small><input value="先生成 3 个方向供评审"></div><div class="bcard"><small>审核节点</small><input value="企划、设计师、供应链复核"></div></div></div><div class="note">来源追溯：企划报告、规则 '+S.rule+' 和商品证据。未确认字段为假设，不作生产指令。</div></section><aside class="card panel"><div class="panelhead"><div><h2>关联参考商品</h2><p>来自当前商品池示例。</p></div></div><div class="ref"><img src="assets/product-5.png" alt=""><div><b>Summer Floral Beach Cover Up Dress</b><small>成长期 · 花卉 / 雪纺 / 中长款</small></div></div><div class="feature" style="margin-top:8px"><b>企划类型</b><p>'+TXT[S.stage][0]+'</p></div><div class="feature" style="margin-top:6px"><b>系统边界</b><p>智能设计读取确认企划和知识库；关键决策由业务与设计师确认。</p></div><button class="btn primary" data-view="design" style="width:100%;margin-top:10px">创建智能设计任务</button></aside></div></div>'}
function DESIGN(){let cards=S.generated?'<div class="previews">'+[["A · 常青底盘","A-line · 植物小花 · 系带","assets/product-5.png"],["B · 阶段变化","衬衫裙 · 边饰构图 · 蓝白","assets/product-2.png"],["C · 试错款","裹身裙 · 放大花型 · 低比例验证","assets/product-4.png"]].map(function(a){return '<div class="preview"><img src="'+a[2]+'" alt="参考图示意"><div><b>方向 '+a[0]+'</b><p>'+a[1]+' · 现有商品参考图</p></div></div>'}).join("")+'</div>':'<div class="empty">等待生成设计方向<br><button class="btn primary" id="sim" style="margin-top:10px">模拟生成 3 个方向</button></div>';return '<div class="page"><div class="head"><div><div class="eyebrow">SMART DESIGN · HUMAN REVIEW</div><h1>智能设计</h1><p>读取确认企划和设计知识库，生成可供人工评审的设计方向。</p></div><div class="actions"><button class="btn" data-view="brief">← 查看 Brief</button><button class="btn primary" id="simTop">'+(S.generated?"重新生成方向":"生成设计方向")+'</button></div></div>'+FLOW(4)+'<div class="toolrow" style="margin-bottom:9px"><span class="tag">前端演示 · 不调用图像模型</span><span class="tag">3 个方向 / 人工评审</span></div><div class="designgrid"><aside class="card panel"><div class="panelhead"><div><h2>任务上下文</h2><p>由企划和 Brief 继承。</p></div></div><div class="feature"><b>品类 / 市场</b><p>美国站 · Temu · 连衣裙</p></div><div class="feature" style="margin-top:6px"><b>版型 / 元素</b><p>A-line、衬衫裙；植物花型、边饰、系带</p></div><div class="feature" style="margin-top:6px"><b>生产约束</b><p>成本、面料与工艺需接入知识库校验。</p></div><div class="note warn">参考图为现有样本；设计师需审核审美与可生产性。</div><button class="btn" data-view="feedback" style="width:100%;margin-top:9px">查看效果回流 →</button></aside><section class="card panel"><div class="panelhead"><div><h2>设计方向预览</h2><p>展示企划方向的转译位置，图片不是模型生成结果。</p></div><small>'+(S.generated?"待设计师评审":"尚未生成")+'</small></div>'+cards+'</section></div></div>'}
function FEEDBACK(){return '<div class="page"><div class="head"><div><div class="eyebrow">LEARNING LOOP · PERFORMANCE FEEDBACK</div><h1>效果复盘与智能体成长</h1><p>把企划采纳、上架动销与售后结果回收到标签权重和规则版本。</p></div><div class="actions"><button class="btn" data-view="report">查看企划报告</button><button class="btn primary" data-view="insight">新一轮趋势洞察 →</button></div></div>'+FLOW(5)+'<div class="grid metrics"><div class="card metric"><small>企划采纳率</small><b>待回收</b><small>企划方向进入开款的比例</small></div><div class="card metric"><small>上架转化</small><b>待回收</b><small>设计任务到商品上架转化</small></div><div class="card metric"><small>售罄速度 / 退货率</small><b>待回收</b><small>与同店铺历史基线对照</small></div></div><section class="card panel"><div class="panelhead"><div><h2>F.AGENT 如何从结果中学习</h2><p>逐轮校准标签与规则，保留历史版本和人工审批。</p></div></div><div class="loop"><div><b>1 · 结果采集</b><small>销量、售罄、退货、差评与折扣回流。</small></div><div><b>2 · 归因审核</b><small>关联企划标签、阶段判断和来源商品。</small></div><div><b>3 · 规则校准</b><small>企划与数据评审权重和阈值，记录版本。</small></div><div><b>4 · 下一轮企划</b><small>新版本用于后续样本，不覆盖历史判断。</small></div></div></section><div class="split" style="margin-top:10px"><section class="card panel"><div class="panelhead"><div><h2>试点结果录入</h2><p>原型演示；正式版需连接上架与经营数据。</p></div></div><div class="fields"><div class="field"><label>企划采纳率</label><input placeholder="%"></div><div class="field"><label>上架转化率</label><input placeholder="%"></div><div class="field"><label>平均售罄天数</label><input placeholder="天"></div><div class="field"><label>退货率</label><input placeholder="%"></div><div class="field"><label>折扣率</label><input placeholder="%"></div><div class="field"><label>复盘备注</label><input placeholder="异常或业务判断"></div></div><button class="btn primary" id="saveFeedback">提交复盘</button></section><section class="card panel"><div class="panelhead"><div><h2>风险与成本控制</h2><p>从小范围试点开始。</p></div></div><div class="feature"><b>数据合规</b><p>采集范围、频次与用途按授权和平台规则配置。</p></div><div class="feature" style="margin-top:6px"><b>数据质量</b><p>销量缺失、时间异常和低置信度转人工复核。</p></div><div class="feature" style="margin-top:6px"><b>模型成本</b><p>规则筛选高价值样本；设置预算、批次上限、重试与告警。</p></div></section></div></div>'}
function render(){document.getElementById("crumb").textContent=LABEL[S.view];document.querySelectorAll(".nav [data-view]").forEach(function(x){x.classList.toggle("active",x.dataset.view===S.view)});ROOT.innerHTML=({insight:INSIGHT,planning:PLANNING,report:REPORT,brief:BRIEF,design:DESIGN,feedback:FEEDBACK})[S.view]();bind()}
function go(v){if(LABEL[v]){S.view=v;render();ROOT.scrollTop=0}}
function toast(x){let t=document.getElementById("toast");t.textContent=x;t.classList.add("show");clearTimeout(window.__t);window.__t=setTimeout(function(){t.classList.remove("show")},2000)}
function bind(){let q=document.getElementById("query");if(q)q.addEventListener("input",function(){S.query=this.value;document.getElementById("rows").innerHTML=ROWS();document.getElementById("rowCount").textContent="显示 "+LIST().length+" 条演示商品"});let f=document.getElementById("filter");if(f)f.addEventListener("change",function(){S.filter=this.value;document.getElementById("rows").innerHTML=ROWS();document.getElementById("rowCount").textContent="显示 "+LIST().length+" 条演示商品"});let make=document.getElementById("make");if(make)make.onclick=function(){let n=MIX.reduce(function(a,x){return a+Number(S.mix[x])},0);if(n!==100){toast("货盘比例合计 "+n+"%，请调整至 100%");return}go("report")};let cb=document.getElementById("confirm");if(cb)cb.onclick=function(){S.confirmed=true;go("brief");toast("企划方向已确认并带入 Brief")};["sim","simTop"].forEach(function(id){let b=document.getElementById(id);if(b)b.onclick=function(){S.generated=true;render();toast("演示方向已生成，待设计师评审")}});let sf=document.getElementById("saveFeedback");if(sf)sf.onclick=function(){toast("结果已记入演示状态")};let ex=document.getElementById("export");if(ex)ex.onclick=function(){let a=[["商品ID","标题","趋势周期","阶段信号","置信度","来源","采集时间"]].concat(LIST().map(function(p){return[p.id,p.title,p.phase,p.signal,p.confidence+"%",p.source,p.time]}));let csv="\ufeff"+a.map(function(r){return r.map(function(v){return '"'+String(v).replace(/"/g,'""')+'"'}).join(",")}).join("\n");let l=document.createElement("a");l.href=URL.createObjectURL(new Blob([csv],{type:"text/csv;charset=utf-8"}));l.download="趋势洞察商品样本.csv";l.click();URL.revokeObjectURL(l.href)}}
function detail(id){let p=D.find(function(x){return x.id===id});if(!p)return;document.getElementById("modalRoot").innerHTML='<div class="modalbg show"><div class="modal"><div class="modalhead"><b>商品证据 · '+p.id+'</b><button class="btn" data-close>关闭</button></div><div class="modalbody"><div class="detail"><img src="'+p.img+'" alt=""><div><h2 style="font-size:12px">'+E(p.title)+'</h2>'+P(p)+' <span class="tag">'+p.confidence+'% 置信度</span><dl><dt>品类</dt><dd>'+E(p.category)+'</dd><dt>店铺</dt><dd>'+E(p.shop)+'</dd><dt>阶段信号</dt><dd>'+p.signal+' · '+p.hint+'</dd><dt>证据数</dt><dd>'+p.evidence+' 项</dd><dt>标签</dt><dd>'+p.tags.join("、")+'</dd><dt>来源 / 时间</dt><dd>'+p.source+' · '+p.time+'</dd><dt>规则版本</dt><dd>'+S.rule+' · 演示配置</dd></dl><div class="note '+(p.confidence<70?"warn":"")+'">'+(p.confidence<70?"置信度偏低，需人工复核。":"判定依据可追溯。")+'</div></div></div></div><div class="modalfoot"><button class="btn primary" data-add>加入企划证据</button></div></div></div>'}
function showRules(){document.getElementById("modalRoot").innerHTML='<div class="modalbg show"><div class="modal"><div class="modalhead"><b>生命周期判定规则 · '+S.rule+'</b><button class="btn" data-close>关闭</button></div><div class="modalbody"><p style="font-size:9px;color:#8490a5">以下为演示值；正式试点需业务团队校准。</p><div class="fields"><div class="field"><label>最小有效天数</label><input type="number" value="14"></div><div class="field"><label>成长期参考增速 %</label><input type="number" value="20"></div><div class="field"><label>低置信度复核阈值 %</label><input type="number" value="70"></div><div class="field"><label>成熟观察窗口（周）</label><input type="number" value="4"></div><div class="field"><label>衰退参考增速 %</label><input type="number" value="-15"></div><div class="field"><label>数据策略</label><select><option>授权数据优先并记录来源</option></select></div></div><div class="note">原始事实、规则版本、阶段结果、置信度与人工复核状态分开保存；更新规则不覆盖历史判断。</div></div><div class="modalfoot"><button class="btn primary" id="saveRule">保存演示规则版本</button></div></div></div>'}
document.addEventListener("click",function(e){let v=e.target.closest("[data-view]");if(v){go(v.dataset.view);return}let st=e.target.closest("[data-stage]");if(st){S.stage=st.dataset.stage;render();return}let ph=e.target.closest("[data-phase]");if(ph){S.filter=S.filter===ph.dataset.phase?"":ph.dataset.phase;render();return}let r=e.target.closest("tr[data-id]");if(r){detail(r.dataset.id);return}if(e.target.closest("[data-close]")||e.target.classList.contains("modalbg")){document.getElementById("modalRoot").innerHTML="";return}if(e.target.closest("[data-add]")){document.getElementById("modalRoot").innerHTML="";toast("已加入企划证据");return}if(e.target.id==="ruleBtn"){showRules();return}if(e.target.id==="saveRule"){S.rule="v0.4-draft";document.getElementById("modalRoot").innerHTML="";render();toast("已保存演示规则版本，待业务确认")}});
document.addEventListener("input",function(e){if(e.target.matches("[data-mix]")){S.mix[e.target.dataset.mix]=Math.max(0,Math.min(100,Number(e.target.value)||0));let n=MIX.reduce(function(a,x){return a+Number(S.mix[x])},0),t=document.getElementById("total");if(t){t.className="total "+(n===100?"ok":"bad");t.innerHTML="<span>示例货盘比例 · 可配置</span><strong>"+n+"%</strong>"}}});
render();
</script></body></html>
